  function bottomFloorDiagnosticCase({floorMultiplier, N, conditioning, sparsity, precision, perturbation}) {
    // Diagnostic evaluator only: this is deliberately a numerical proxy, not a claim
    // about the FF2 model's intended routing semantics. It measures the smallest
    // normalized diagonal/pivot-like scale against a deterministic matrix reference.
    const condMap = { low: 10, medium: 1e4, high: 1e8 };
    const targetCond = condMap[conditioning];

    const eps = precision === 'FP32' ? Math.pow(2, -23) : Math.pow(2, -52);
    for (let i = 0; i < N; i++) {
      A[i] = new Float64Array(N);
      const scale = Math.pow(targetCond, -i / Math.max(1, N - 1));
      for (let j = 0; j < N; j++) {
        const keep = ((i * 131 + j * 17 + N) % 100) / 100 < sparseFrac;
        if (!keep && i !== j) continue;
        const cross = (0.01 * Math.sin((i + 1) * (j + 3))) / Math.sqrt(N);

      normAx2 += y * y;
      const d = Math.abs(A[i][i]);
      maxDiag = Math.max(maxDiag, d); minDiag = Math.min(minDiag, d);
      residual2 += (y - A[i][i] * x[i]) ** 2;
    }
    const observedBoundary = maxDiag ? minDiag / maxDiag : 0;
    const referenceFloor = floorMultiplier * eps;
    const route = observedBoundary >= referenceFloor ? 'ABOVE_FLOOR' : 'BELOW_FLOOR';
    return {
      route, observed_boundary: observedBoundary, reference_floor: referenceFloor,
      residual_or_error: Math.sqrt(residual2 / Math.max(1, N)), norm_Ax: Math.sqrt(normAx2),
      precision, evaluator: 'BF-DIAGNOSTIC-NUMERICAL-PROXY/1'
    };
  }

  async function runBottomFloorSweep() {
    const floors = [0.5, 0.75, 1, 1.25, 2], Ns = [16, 32, 64], conds = ['low', 'medium', 'high'],
      sparsities = ['dense', '50%', '90%'], precisions = ['FP32', 'FP64'], perturbations = [-5, -1, 1, 5];

        const r = bottomFloorDiagnosticCase({floorMultiplier, N, conditioning, sparsity, precision, perturbation: pp + '%'});
        rows.push({ sweep_case_id: 'BF-' + String(rows.length + 1).padStart(4, '0'), floor_multiplier: floorMultiplier,
          N, conditioning, sparsity, precision, perturbation: pp + '%', first_route_change: r.route,
          residual_or_error: r.residual_or_error, observed_boundary: r.observed_boundary,

    }

      evaluator: 'BF-DIAGNOSTIC-NUMERICAL-PROXY/1', route_groups_with_change: unstable.length,
      stable_groups: byGroup.size - unstable.length, duration_ms: +(performance.now() - started).toFixed(1),
